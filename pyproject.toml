[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porttool"
version = "0.1.0"
description = "AUTOSAR Classic port and connection tool for DaVinci Developer / Configurator 5 projects (Windows only)"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5",
  "openpyxl>=3.1",
  "XlsxWriter>=3.1",
  "pydantic>=2.6",
  "click>=8.1",
  "psutil>=5.9",
]

[project.scripts]
porttool = "porttool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["porttool*"]

[tool.setuptools.package-data]
porttool = ["gui/static/*", "gui/static/**/*", "davinci/groovy/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "windows_only: can only be verified on a real Windows machine",
  "davinci: needs DaVinci tools and the real ECU repo",
  "slow: benchmark or soak test",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["lxml.*", "xlsxwriter.*", "openpyxl.*", "psutil.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "ASYNC", "S602", "S604", "S605"]
